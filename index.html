<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;500;700&family=Moul&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<title>សម្រង់អវត្តមាន</title>
<style>
  :root{
    --ink:#132436;
    --muted:#7c8ba0;
    --bg:#e7edf5;
    --surface:#ffffff;
    --surface-soft:#f3f6fb;
    --primary:#1b6e82;
    --primary-dark:#134f5e;
    --gold:#c79a3b;
    --present:#2e9e5c;
    --present-soft:#e4f5eb;
    --absent:#d9534f;
    --absent-soft:#fbe7e6;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow: 0 10px 30px rgba(19,36,54,0.10);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"Battambang", system-ui, sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -10%, #dfeaf6 0%, var(--bg) 55%);
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .app{
    max-width:640px;
    margin:0 auto;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--surface);
    box-shadow: var(--shadow);
    overflow:hidden;
    position:relative;
  }

  /* ---------- Header ---------- */
  .header{
    position:relative;
    padding:18px 18px 14px;
    background: linear-gradient(155deg, var(--primary-dark), var(--primary) 65%);
    color:#eaf4f7;
    overflow:visible;
    z-index:20;
    flex-shrink:0;
  }

  .header::after{
    content:"";
    position:absolute;
    right:-30px;
    bottom:-30px;
    width:220px;
    height:120px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 120'><g fill='%23c79a3b' opacity='0.35'><rect x='20' y='70' width='180' height='8'/><polygon points='40,70 50,40 60,70'/><polygon points='95,70 110,20 125,70'/><polygon points='160,70 170,40 180,70'/></g></svg>") no-repeat center / contain;
    pointer-events:none;
  }

  .title-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:8px;
    margin:0 0 14px;
    position:relative;
  }

  .title-row h1{
    font-family:"Moul", "Battambang", serif;
    font-weight:400;
    font-size:1.15rem;
    letter-spacing:0.3px;
    margin:0;
    text-align:center;
  }

  .title-row .badge{
    font-size:0.95rem;
  }

  .row-inline{
    display:flex;
    gap:8px;
    align-items:stretch;
  }

  .field{
    position:relative;
    flex:1;
    min-width:0;
  }

  .field i.leading{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    font-size:0.85rem;
    pointer-events:none;
  }

  #dateInput{
    width:100%;
    padding:11px 12px 11px 34px;
    border:none;
    border-radius:var(--radius-sm);
    background:rgba(255,255,255,0.94);
    color:var(--ink);
    font-family:inherit;
    font-size:0.92rem;
    outline:none;
    transition:box-shadow .18s ease, transform .18s ease;
  }
  #dateInput:focus{ box-shadow:0 0 0 3px rgba(199,154,59,0.55); }

  .score-link{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 14px;
    border-radius:var(--radius-sm);
    background:rgba(159, 214, 250, 0.14);
    border:1px solid rgba(255,255,255,0.35);
    color:#fff;
    text-decoration:none;
    font-size:0.85rem;
    white-space:nowrap;
    transition:background .18s ease, transform .12s ease;
  }
  .score-link:active{ transform:scale(0.96); }
  .score-link:hover{ background:rgba(255,255,255,0.24); }

  .footer .score-link{
    height:52px;
    border-radius:99px;
    padding:0 18px;
    background:rgba(159, 214, 250, 0.39);
    border:1.5px solid #dfe6ee;
    color:var(--ink);
  }
  .footer .score-link:hover{ background:#bad0edcc; }

  #search{
    width:100%;
    padding:11px 12px 11px 34px;
    border:none;
    border-radius:var(--radius-sm);
    background:rgba(255,255,255,0.94);
    font-family:inherit;
    font-size:0.92rem;
    outline:none;
    transition:box-shadow .18s ease;
  }
  #search:focus{ box-shadow:0 0 0 3px rgba(199,154,59,0.55); }
  #search::placeholder{ color:#7c8ba0; }

  /* ---------- Export Dropdowns ---------- */
  .dropdown{
    position:relative;
    flex-shrink:0;
    display:flex;
  }

  .export-btn{
    display:flex;
    align-items:center;
    gap:5px;
    padding:0 11px;
    border-radius:var(--radius-sm);
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.35);
    color:#fff;
    font-family:inherit;
    font-size:0.82rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:background .18s ease, transform .12s ease;
  }
  .export-btn:hover{ background:rgba(255,255,255,0.24); }
  .export-btn:active{ transform:scale(0.96); }

  .export-btn.pdf i.icon-type{ color:#ff9b95; }
  .export-btn.excel i.icon-type{ color:#7fe0a8; }

  .dropdown-menu{
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    min-width:155px;
    max-height:260px;
    overflow-y:auto;
    background:var(--surface);
    border-radius:var(--radius-sm);
    box-shadow:0 12px 28px rgba(19,36,54,0.22);
    border:1px solid #dfe6ee;
    padding:4px;
    display:none;
    z-index:100;
  }
  .dropdown-menu.open{
    display:block;
    animation:menuIn .16s ease forwards;
  }
  @keyframes menuIn{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .dropdown-item{
    width:100%;
    text-align:left;
    padding:8px 12px;
    border:none;
    background:transparent;
    color:var(--ink);
    font-family:inherit;
    font-size:0.86rem;
    border-radius:7px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:background .14s ease, color .14s ease;
  }
  .dropdown-item:hover{
    background:var(--surface-soft);
    color:var(--primary);
  }
  .dropdown-item span.en-month{
    font-size:0.75rem;
    color:var(--muted);
  }

  /* progress */
  .progress-wrap{
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .progress-track{
    flex:1;
    height:6px;
    border-radius:99px;
    background:rgba(255,255,255,0.25);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--gold);
    border-radius:99px;
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{
    font-size:0.75rem;
    color:#eaf4f7;
    opacity:0.9;
    white-space:nowrap;
  }

  /* ---------- Content ---------- */
  .content{
    flex:1;
    overflow-y:auto;
    padding:12px 12px 20px;
    background:var(--surface-soft);
  }

  .state-msg{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:60px 20px;
    color:var(--muted);
    text-align:center;
    font-size:0.9rem;
  }

  .spinner{
    width:34px; height:34px;
    border-radius:50%;
    border:3px solid #d7e2ec;
    border-top-color:var(--primary);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .student-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    background:var(--surface);
    border-radius:var(--radius-md);
    margin-bottom:8px;
    box-shadow:0 1px 0 rgba(19,36,54,0.04);
    opacity:0;
    transform:translateY(8px);
    animation:rowIn .35s ease forwards;
  }
  @keyframes rowIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .avatar{
    flex-shrink:0;
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, var(--gold), #b6832a);
    color:#fff;
    font-size:0.85rem;
    font-weight:700;
  }

  .student-name{
    flex:1;
    font-size:0.95rem;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .status-group{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }

  .status-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:1.5px solid #dfe6ee;
    background:#fff;
    color:#b6bfcb;
    display:flex; align-items:center; justify-content:center;
    font-size:0.85rem;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .12s ease;
  }
  .status-btn:active{ transform:scale(0.9); }

  .status-btn.present.active{
    background:var(--present);
    border-color:var(--present);
    color:#fff;
    animation:pop .28s ease;
  }
  .status-btn.absent.active{
    background:var(--absent);
    border-color:var(--absent);
    color:#fff;
    animation:pop .28s ease;
  }
  .btn-text{ font-size:0.85rem; 
    font-weight:700; 
    color:#363535fc; 
    font-family: times-new-roman;
}
  @keyframes pop{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.22); }
    100%{ transform:scale(1); }
  }

  .student-row[data-status="P"]{ background:var(--present-soft); }
  .student-row[data-status="A"]{ background:var(--absent-soft); }

  /* ---------- Footer ---------- */
  .footer{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:var(--surface);
    border-top:1px solid #e7edf5;
  }

  .btn{
    border:none;
    cursor:pointer;
    font-family:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition: transform .12s ease, box-shadow .12s ease, opacity .15s ease;
  }
  .btn:active{ transform:translateY(2px); }

  .btn-reset{
    width:52px; height:52px;
    border-radius:50%;
    background:var(--surface-soft);
    border:1.5px solid #dfe6ee;
    color:var(--muted);
    font-size:1rem;
  }
  .btn-reset:hover{ color:var(--ink); }

  .btn-submit{
    flex:1;
    max-width:280px;
    height:52px;
    border-radius:99px;
    background:linear-gradient(155deg, var(--primary), var(--primary-dark));
    color:#fff;
    font-size:0.98rem;
    box-shadow:0 8px 18px rgba(19,78,94,0.35);
  }
  .btn-submit:disabled{ opacity:0.85; cursor:default; }
  .btn-submit.success{ background:linear-gradient(155deg, var(--present), #237a47); }

  .btn-submit i.fa-hourglass{ animation:spin 1s linear infinite; }

  /* scrollbar */
  .content::-webkit-scrollbar{ width:6px; }
  .content::-webkit-scrollbar-thumb{ background:#c9d5e2; border-radius:99px; }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  /* ---------- Toast ---------- */
  .toast-layer{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding: 0 16px calc(90px + env(safe-area-inset-bottom));
    pointer-events:none;
    z-index:50;
  }

  .toast{
    display:flex;
    align-items:center;
    gap:10px;
    max-width:100%;
    padding:13px 16px;
    border-radius:var(--radius-md);
    background:var(--ink);
    color:#fff;
    font-size:0.88rem;
    box-shadow:0 12px 28px rgba(19,36,54,0.28);
    opacity:0;
    transform:translateY(14px) scale(0.96);
    transition: opacity .22s ease, transform .22s ease;
    pointer-events:auto;
  }
  .toast.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  .toast i{
    flex-shrink:0;
    font-size:1rem;
  }
  .toast.warn i{ color:var(--gold); }
  .toast.error i{ color:#ff8a83; }
  .toast.success i{ color:#7fe0a8; }

  /* ---------- Sending overlay ---------- */
  .app-overlay{
    position:absolute;
    inset:0;
    background:rgba(231,237,245,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:40;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .app-overlay.show{
    opacity:1;
    pointer-events:auto;
  }

  /* ---------- Download popup ---------- */
  .dl-overlay{
    position:absolute; inset:0; z-index:60;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(19,36,54,0.48);
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    opacity:0; pointer-events:none;
    transition:opacity .28s ease;
  }
  .dl-overlay.show{ opacity:1; pointer-events:auto; }

  .dl-card{
    --accent:var(--primary);
    width:100%; max-width:320px;
    padding:30px 22px 20px;
    text-align:center;
    background:var(--surface);
    border-radius:26px;
    box-shadow:0 28px 70px rgba(19,36,54,0.38);
    transform:translateY(28px) scale(.9);
    opacity:0;
    transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
  }
  .dl-overlay.show .dl-card{ transform:none; opacity:1; }
  .dl-card.t-pdf{ --file:#d9534f; }
  .dl-card.t-excel{ --file:#2e9e5c; }
  .dl-card.is-success{ --accent:var(--present); }
  .dl-card.is-error{ --accent:var(--absent); }

  .dl-icon{ position:relative; width:104px; height:104px; margin:0 auto 20px; }
  .dl-glow{
    position:absolute; inset:-6px; border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 30%, transparent) 0%, transparent 70%);
    animation:dlPulse 1.8s ease-in-out infinite;
  }
  .dl-card:not(.is-loading) .dl-glow{ animation:none; opacity:.8; }
  @keyframes dlPulse{ 0%,100%{ transform:scale(.9); opacity:.6; } 50%{ transform:scale(1.12); opacity:1; } }

  .dl-ring{ position:absolute; inset:4px; width:96px; height:96px; transition:opacity .25s ease; }
  .dl-ring circle{ fill:none; stroke-width:5; }
  .dl-ring .track{ stroke:#e7edf5; }
  .dl-ring .arc{
    stroke:url(#dlGrad); stroke-linecap:round;
    stroke-dasharray:70 207;
    transform-origin:50% 50%;
    animation:dlSpin 1.1s cubic-bezier(.5,.15,.5,.85) infinite;
  }
  @keyframes dlSpin{ to{ transform:rotate(360deg); } }
  .dl-card:not(.is-loading) .dl-ring{ opacity:0; }

  .dl-file{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:2.3rem; color:var(--file);
    animation:dlFloat 1.6s ease-in-out infinite;
    transition:opacity .2s ease, transform .3s ease;
  }
  @keyframes dlFloat{ 0%,100%{ transform:translateY(2px); } 50%{ transform:translateY(-5px); } }
  .dl-card:not(.is-loading) .dl-file{ opacity:0; transform:scale(.4); animation:none; }

  .dl-badge{
    position:absolute; inset:4px; width:96px; height:96px;
    opacity:0; transform:scale(.3);
  }
  .dl-badge circle{ fill:var(--accent); }
  .dl-badge path{
    fill:none; stroke:#fff; stroke-width:6;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:80; stroke-dashoffset:80;
  }
  .dl-card.is-success .dl-badge.ok,
  .dl-card.is-error .dl-badge.err{
    opacity:1; transform:scale(1);
    transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
  }
  .dl-card.is-success .dl-badge.ok path,
  .dl-card.is-error .dl-badge.err path{
    animation:dlDraw .45s .25s ease forwards;
  }
  @keyframes dlDraw{ to{ stroke-dashoffset:0; } }
  .dl-card.is-error .dl-icon{ animation:dlShake .5s .2s ease; }
  @keyframes dlShake{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-7px); } 40%{ transform:translateX(7px); }
    60%{ transform:translateX(-4px); } 80%{ transform:translateX(4px); }
  }

  .dl-title{
    margin:0 0 6px;
    font-family:"Moul","Battambang",serif; font-weight:400;
    font-size:0.98rem; line-height:1.6; color:var(--ink);
  }
  .dl-sub{ margin:0; font-size:0.86rem; line-height:1.6; color:var(--muted); min-height:1.4em; }
  .dl-dots span{ display:inline-block; animation:dlDot 1.2s infinite both; }
  .dl-dots span:nth-child(2){ animation-delay:.2s; }
  .dl-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes dlDot{ 0%,80%,100%{ opacity:.2; } 40%{ opacity:1; } }
  .dl-card:not(.is-loading) .dl-dots{ display:none; }

  .dl-progress{
    display:flex; align-items:center; gap:10px;
    margin-top:18px;
    max-height:24px; overflow:hidden;
    transition:max-height .3s ease, opacity .25s ease, margin .3s ease;
  }
  .dl-card:not(.is-loading) .dl-progress{ max-height:0; opacity:0; margin-top:0; }
  .dl-bar{ flex:1; height:8px; border-radius:99px; background:#e7edf5; overflow:hidden; }
  .dl-fill{
    height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg, var(--primary), #3fb4cf, var(--gold));
    background-size:200% 100%;
    animation:dlShimmer 1.4s linear infinite;
    transition:width .3s ease;
  }
  @keyframes dlShimmer{ to{ background-position:-200% 0; } }
  .dl-pct{ min-width:38px; text-align:right; font-size:0.78rem; font-weight:700; color:var(--primary-dark); font-variant-numeric:tabular-nums; }

  .dl-actions{ display:flex; gap:8px; margin-top:20px; }
  .dl-btn{
    flex:1; height:44px;
    border-radius:99px; border:1.5px solid #dfe6ee;
    background:var(--surface-soft); color:var(--ink);
    font-family:inherit; font-size:0.88rem; cursor:pointer;
    transition:transform .12s ease, background .18s ease;
  }
  .dl-btn:hover{ background:#e8eef6; }
  .dl-btn:active{ transform:scale(.96); }
  .dl-btn.primary{
    border-color:transparent; color:#fff;
    background:linear-gradient(155deg, var(--primary), var(--primary-dark));
    box-shadow:0 6px 14px rgba(19,78,94,0.3);
  }
  .dl-btn[hidden]{ display:none; }
</style>
</head>
<body>
  <div class="app">

    <div class="header">
      <div class="title-row">
        <h1>សម្រង់អវត្តមានថ្នាក់ទី៧ "I"</h1>
        <span class="badge">👨‍💻</span>
      </div>

      <div class="row-inline">
        <div class="field">
          <i class="fa-regular fa-calendar leading"></i>
          <input type="date" id="dateInput" />
        </div>

        <div class="dropdown">
          <button type="button" class="export-btn excel" onclick="toggleDropdown('excelMenu', event)" aria-label="នាំចេញ Excel">
            <i class="fa-solid fa-file-excel icon-type"></i>ទាញយក Excel <i class="fa-solid fa-caret-down"></i>
          </button>
          <div class="dropdown-menu" id="excelMenu"></div>
        </div>
      </div>

      <div class="row-inline" style="margin-top:8px;">
        <div class="field">
          <i class="fa-solid fa-magnifying-glass leading"></i>
          <input type="text" id="search" placeholder="ស្វែងរកឈ្មោះសិស្ស..." oninput="filterStudents()" />
        </div>
        <div class="dropdown">
          <button type="button" class="export-btn pdf" onclick="toggleDropdown('pdfMenu', event)" aria-label="នាំចេញ PDF">
            <i class="fa-solid fa-file-pdf icon-type"></i>ទាញយក PDF <i class="fa-solid fa-caret-down"></i>
          </button>
          <div class="dropdown-menu" id="pdfMenu"></div>
        </div>
      
      </div>

      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel">0 / 0</div>
      </div>
    </div>

    <div id="student-list" class="content"></div>

    <div class="footer">
      <button id="resetBtn" class="btn btn-reset" onclick="resetForm()" aria-label="កំណត់ឡើងវិញ">
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>
      <button id="submitBtn" class="btn btn-submit" onclick="submitForm()">
        <i class="fa-regular fa-paper-plane"></i> ដាក់ស្នើ
      </button>
      <a class="score-link" href="score.html">
        <i class="fa-solid fa-chart-simple"></i> សម្រង់ពិន្ទុ
      </a>
    </div>

    <div class="toast-layer" id="toastLayer"></div>

    <div class="app-overlay" id="appOverlay"></div>

    <div class="dl-overlay" id="dlOverlay" role="dialog" aria-modal="true" aria-live="polite">
      <div class="dl-card is-loading t-pdf" id="dlCard">
        <div class="dl-icon">
          <span class="dl-glow"></span>
          <svg class="dl-ring" viewBox="0 0 96 96" aria-hidden="true">
            <defs>
              <linearGradient id="dlGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1b6e82"/>
                <stop offset="1" stop-color="#c79a3b"/>
              </linearGradient>
            </defs>
            <circle class="track" cx="48" cy="48" r="44"/>
            <circle class="arc" cx="48" cy="48" r="44"/>
          </svg>
          <i class="dl-file fa-solid fa-file-pdf" id="dlFileIcon"></i>
          <svg class="dl-badge ok" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="44"/><path d="M30 50 L43 63 L67 36"/></svg>
          <svg class="dl-badge err" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="44"/><path d="M35 35 L61 61 M61 35 L35 61"/></svg>
        </div>
        <h3 class="dl-title" id="dlTitle"></h3>
        <p class="dl-sub"><span id="dlSub"></span><span class="dl-dots"><span>.</span><span>.</span><span>.</span></span></p>
        <div class="dl-progress">
          <div class="dl-bar"><div class="dl-fill" id="dlFill"></div></div>
          <span class="dl-pct" id="dlPct">0%</span>
        </div>
        <div class="dl-actions">
          <button type="button" class="dl-btn" id="dlCancel">បោះបង់</button>
          <button type="button" class="dl-btn primary" id="dlRetry" hidden>ព្យាយាមម្តងទៀត</button>
          <button type="button" class="dl-btn" id="dlClose" hidden>បិទ</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbzkha6F7Z0FmKK1yYNWgitVlXhbChQxYywxUZIz0hA5iDmhxpxg_kZ12q0KEsYc098E2w/exec';
  let students = [];
  let filteredStudents = [];

  const SCHOOL_MONTHS = [
    { en: 'November', km: 'វិច្ឆិកា' },
    { en: 'December', km: 'ធ្នូ' },
    { en: 'January', km: 'មករា' },
    { en: 'February', km: 'កុម្ភៈ' },
    { en: 'March', km: 'មីនា' },
    { en: 'April', km: 'មេសា' },
    { en: 'May', km: 'ឧសភា' },
    { en: 'June', km: 'មិថុនា' },
    { en: 'July', km: 'កក្កដា' },
    { en: 'August', km: 'សីហា' }
  ];

  function initDropdowns() {
    const pdfMenu = document.getElementById('pdfMenu');
    const excelMenu = document.getElementById('excelMenu');

    SCHOOL_MONTHS.forEach(m => {
      const pdfItem = document.createElement('button');
      pdfItem.type = 'button';
      pdfItem.className = 'dropdown-item';
      pdfItem.innerHTML = `<span>ខែ${m.km}</span><span class="en-month">${m.en}</span>`;
      pdfItem.onclick = () => handleExport('pdf', m);
      pdfMenu.appendChild(pdfItem);

      const excelItem = document.createElement('button');
      excelItem.type = 'button';
      excelItem.className = 'dropdown-item';
      excelItem.innerHTML = `<span>ខែ${m.km}</span><span class="en-month">${m.en}</span>`;
      excelItem.onclick = () => handleExport('excel', m);
      excelMenu.appendChild(excelItem);
    });
  }

  function toggleDropdown(menuId, event) {
    event.stopPropagation();
    const targetMenu = document.getElementById(menuId);
    const isOpen = targetMenu.classList.contains('open');

    document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('open'));
    if (!isOpen) {
      targetMenu.classList.add('open');
    }
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('open'));
  });

  /* ---------- Date helpers (timezone-safe) ---------- */
  const MONTH_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const pad2 = n => String(n).padStart(2, '0');

  function localToday() {
    const d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function getMonthFromDate(dateStr) {
    return MONTH_EN[parseInt(String(dateStr).split('-')[1], 10) - 1] || '';
  }
  function getDayFromDate(dateStr) {
    return parseInt(String(dateStr).split('-')[2], 10);
  }

  /* ---------- Download helpers (all browsers) ---------- */
  function base64ToBlob(b64, mime) {
    const binary = atob(String(b64).replace(/\s/g, ''));
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: mime || 'application/octet-stream' });
  }

  function saveBlob(blob, filename) {
    // Old Edge / IE
    if (navigator.msSaveOrOpenBlob) {
      navigator.msSaveOrOpenBlob(blob, filename);
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.rel = 'noopener';
    a.href = url;

    if (typeof a.download === 'undefined') {
      // very old iOS/WebViews: no download attribute -> open the file instead
      window.location.href = url;
    } else {
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    // keep the URL alive long enough for slow phones / big files
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  function isInAppBrowser() {
    return /FBAN|FBAV|FB_IAB|Instagram|Line\/|Zalo|MicroMessenger|; wv\)/i.test(navigator.userAgent);
  }

  /* ---------- Download popup ---------- */
  let exporting = false;
  let lastExport = null;
  let userCancelled = false;
  let activeCtrl = null;
  let dlProgress = 0;
  let dlTicker = null;
  let dlAutoClose = null;

  const dl = {
    overlay: document.getElementById('dlOverlay'),
    card: document.getElementById('dlCard'),
    icon: document.getElementById('dlFileIcon'),
    title: document.getElementById('dlTitle'),
    sub: document.getElementById('dlSub'),
    fill: document.getElementById('dlFill'),
    pct: document.getElementById('dlPct'),
    cancel: document.getElementById('dlCancel'),
    retry: document.getElementById('dlRetry'),
    close: document.getElementById('dlClose')
  };

  function dlState(state, title, sub) {
    const type = (lastExport && lastExport.type) || 'pdf';
    dl.card.className = 'dl-card is-' + state + ' t-' + type;
    dl.title.textContent = title;
    dl.sub.textContent = sub || '';
    dl.cancel.hidden = state !== 'loading';
    dl.retry.hidden = state !== 'error';
    dl.close.hidden = state === 'loading';
  }

  function dlRender() {
    const v = Math.min(100, Math.round(dlProgress));
    dl.fill.style.width = v + '%';
    dl.pct.textContent = v + '%';
  }

  function dlStartProgress() {
    clearInterval(dlTicker);
    dlProgress = 3;
    dlRender();
    // eases toward 92% and waits there until the server answers
    dlTicker = setInterval(() => {
      dlProgress += (92 - dlProgress) * 0.04;
      dlRender();
    }, 180);
  }

  function dlStopProgress() { clearInterval(dlTicker); dlTicker = null; }

  function dlOpen(type, label, monthObj) {
    const where = monthObj ? 'ខែ' + monthObj.km : 'ទាំងអស់';
    clearTimeout(dlAutoClose);
    dl.icon.className = 'dl-file fa-solid ' + (type === 'pdf' ? 'fa-file-pdf' : 'fa-file-excel');
    dlState('loading', 'កំពុងរៀបចំឯកសារ', label + ' · ' + where);
    dlStartProgress();
    dl.overlay.classList.add('show');
  }

  function dlHide() {
    clearTimeout(dlAutoClose);
    dlStopProgress();
    dl.overlay.classList.remove('show');
  }

  function dlSuccess(label, monthObj, inApp) {
    dlStopProgress();
    dlProgress = 100;
    dlRender();
    setTimeout(() => {
      dlState('success', 'ទាញយកបានជោគជ័យ',
        inApp ? 'បើមិនទាញយក សូមបើកក្នុង Chrome ឬ Safari'
              : 'ឯកសារ ' + label + (monthObj ? ' ខែ' + monthObj.km : ' ទាំងអស់') + ' ត្រូវបានរក្សាទុក');
      dlAutoClose = setTimeout(dlHide, inApp ? 5000 : 2200);
    }, 350);
  }

  function dlFail(message) {
    dlStopProgress();
    dlState('error', 'ទាញយកមិនបាន', message);
  }

  dl.cancel.addEventListener('click', () => {
    userCancelled = true;
    if (activeCtrl) activeCtrl.abort();
    dlHide();
  });
  dl.close.addEventListener('click', dlHide);
  dl.retry.addEventListener('click', () => {
    if (lastExport) handleExport(lastExport.type, lastExport.monthObj);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && dl.overlay.classList.contains('show')) {
      (dl.cancel.hidden ? dl.close : dl.cancel).click();
    }
  });

  async function handleExport(type, monthObj) {
    document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('open'));
    if (exporting) return;
    exporting = true;
    userCancelled = false;
    lastExport = { type, monthObj };

    const label = type === 'pdf' ? 'PDF' : 'Excel';
    dlOpen(type, label, monthObj);

    // Khmer sheet name in `month`, English as a fallback in `monthEn`
    const exportURL = scriptURL +
      '?action=export&format=' + encodeURIComponent(type) +
      '&month=' + encodeURIComponent(monthObj.km) +
      '&monthEn=' + encodeURIComponent(monthObj.en) +
      '&_=' + Date.now();

    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    activeCtrl = ctrl;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), 120000) : null;

    try {
      const res = await fetch(exportURL, { redirect: 'follow', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined });
      const text = await res.text();

      let file;
      try { file = JSON.parse(text); }
      catch (_) {
        // Google returned an HTML page (not deployed / not authorised)
        dlFail('Script មិនទាន់ Deploy ថ្មី ឬមិនទាន់អនុញ្ញាត');
        return;
      }

      if (!file || !file.data) {
        dlFail((file && file.error) || 'ទាញយកមិនបាន');
        return;
      }

      const blob = base64ToBlob(file.data, file.mimeType);
      saveBlob(blob, file.filename || ('សម្រង់អវត្តមាន_ខែ' + monthObj.km + (type === 'pdf' ? '.pdf' : '.xlsx')));
      dlSuccess(label, monthObj, isInAppBrowser());
    } catch (err) {
      if (userCancelled) return;
      dlFail(err && err.name === 'AbortError' ? 'ចំណាយពេលយូរពេក សូមព្យាយាមម្តងទៀត' : 'សូមពិនិត្យអ៊ីនធឺណិត ហើយព្យាយាមម្តងទៀត');
    } finally {
      if (timer) clearTimeout(timer);
      activeCtrl = null;
      exporting = false;
    }
  }

  function initials(name) {
    const trimmed = (name || '').trim();
    return trimmed ? trimmed.charAt(0).toUpperCase() : '?';
  }

 let loadToken = 0;

async function loadStudents(date) {
  const month = getMonthFromDate(date);
  const day = getDayFromDate(date);
  const container = document.getElementById('student-list');
  const myToken = ++loadToken;   // ignore stale responses if the date changes quickly

  container.innerHTML = `
    <div class="state-msg">
      <div class="spinner"></div>
      កំពុងទាញឈ្មោះសិស្ស សូមរង់ចាំ...
    </div>
  `;

  try {
    const res = await fetch(`${scriptURL}?month=${encodeURIComponent(month)}&day=${day}&_=${Date.now()}`, { cache: 'no-store' });
    const list = await res.json();
    if (myToken !== loadToken) return;

    students = list.map(s => ({ ...s, status: s.status || '' }));
    document.getElementById('search').value = '';
    filteredStudents = [...students];
    renderStudents();
  } catch (e) {
    if (myToken !== loadToken) return;
    container.innerHTML = `
      <div class="state-msg">
        <i class="fa-solid fa-circle-exclamation" style="font-size:1.6rem;color:var(--absent);"></i>
        មិនអាចទាញសិស្សបានទេ
      </div>
    `;
  }
}
  function updateProgress() {
    const total = filteredStudents.length;
    const marked = filteredStudents.filter(s => s.status).length;
    const pct = total ? Math.round((marked / total) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = `${marked} / ${total}`;
  }

  function renderStudents() {
    const container = document.getElementById('student-list');
    container.innerHTML = '';

    if (filteredStudents.length === 0) {
      container.innerHTML = `
        <div class="state-msg">
          <i class="fa-regular fa-face-frown" style="font-size:1.6rem;"></i>
          រកមិនឃើញសិស្ស
        </div>
      `;
      updateProgress();
      return;
    }

    filteredStudents.forEach((student, index) => {
      const row = document.createElement('div');
      row.className = 'student-row';
      row.dataset.status = student.status || '';
      row.style.animationDelay = `${Math.min(index * 25, 300)}ms`;

      row.innerHTML = `
        <div class="avatar">${index + 1}</div>
        <div class="student-name">${student.name}</div>
        <div class="status-group">
          <button type="button" class="status-btn present ${student.status === 'P' ? 'active' : ''}" data-value="P" aria-label="មកសាលា">
             <span class="btn-text">P</span>
          </button>
          <button type="button" class="status-btn absent ${student.status === 'A' ? 'active' : ''}" data-value="A" aria-label="អវត្តមាន">
            <span class="btn-text">A</span>
          </button>
        </div>
      `;

      row.querySelectorAll('.status-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const value = btn.dataset.value;
          const newStatus = student.status === value ? '' : value;
          student.status = newStatus;
          row.dataset.status = newStatus;
          row.querySelectorAll('.status-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.value === newStatus);
          });
          updateProgress();
        });
      });

      container.appendChild(row);
    });

    updateProgress();
  }

  function showToast(message, type = 'warn') {
    const layer = document.getElementById('toastLayer');
    const icons = {
      warn: 'fa-solid fa-triangle-exclamation',
      error: 'fa-solid fa-circle-exclamation',
      success: 'fa-solid fa-circle-check'
    };

    const existing = layer.querySelector('.toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<i class="${icons[type] || icons.warn}"></i><span>${message}</span>`;
    layer.appendChild(toast);

    requestAnimationFrame(() => toast.classList.add('show'));

    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 220);
    }, 2400);
  }

  function filterStudents() {
    const keyword = document.getElementById('search').value.toLowerCase();
    filteredStudents = students.filter(s => s.name.toLowerCase().includes(keyword));
    renderStudents();
  }

 function resetForm() {
  document.getElementById('search').value = '';
  loadStudents(document.getElementById('dateInput').value);
}

 async function submitForm() {
  const date = document.getElementById('dateInput').value;
  const month = getMonthFromDate(date);
  const day = getDayFromDate(date);

  if (!students.length) {
    showToast('មិនមានឈ្មោះសិស្ស!', 'warn');
    return;
  }

  const data = students.map(s => ({ name: s.name, status: s.status || '' }));

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.innerHTML = '<i class="fa-solid fa-hourglass"></i> កំពុងស្នើ...';
  submitBtn.disabled = true;
  document.getElementById('resetBtn').disabled = true;
  document.getElementById('dateInput').disabled = true;
  document.getElementById('search').disabled = true;
  document.getElementById('appOverlay').classList.add('show');

  try {
    await fetch(scriptURL, {
      method: 'POST',
      body: JSON.stringify({ month, day, attendance: data }),
    });

    submitBtn.classList.add('success');
    submitBtn.innerHTML = '<i class="fa-solid fa-circle-check"></i> បានស្នើ';
    await loadStudents(date);   // reload what is actually saved in the sheet

    setTimeout(() => {
      submitBtn.classList.remove('success');
      submitBtn.innerHTML = '<i class="fa-regular fa-paper-plane"></i> ដាក់ស្នើ';
      submitBtn.disabled = false;
    }, 1800);
  } catch (e) {
    showToast('បញ្ជូនមិនបាន', 'error');
    submitBtn.innerHTML = '<i class="fa-regular fa-paper-plane"></i> ដាក់ស្នើ';
    submitBtn.disabled = false;
  } finally {
    document.getElementById('resetBtn').disabled = false;
    document.getElementById('dateInput').disabled = false;
    document.getElementById('search').disabled = false;
    document.getElementById('appOverlay').classList.remove('show');
  }
}

  window.onload = () => {
    initDropdowns();
    const todayStr = localToday();
    document.getElementById('dateInput').value = todayStr;
    loadStudents(todayStr);
  };

  document.getElementById('dateInput').addEventListener('change', (e) => {
    loadStudents(e.target.value);
  });
</script>
</body>
